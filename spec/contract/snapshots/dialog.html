<div class="large-12 columns" id="content" role="main">
  <div class="example">
    <h3>
      Native Dialog
    <p>
      The HTML
      <code>
        <dialog>
      element. A modal dialog blocks the rest of the page, keeps focus inside and closes with Escape. A non-modal dialog leaves the page usable.
    <button class="button" id="open-modal" type="button">
      Open modal dialog
    <button class="button secondary" id="open-non-modal" type="button">
      Open non-modal dialog
    <p>
      <label for="page-input">
        A field on the page
      <input id="page-input" type="text">
    <p id="result">
      No dialog opened yet
    <dialog aria-labelledby="modal-title" id="modal-dialog">
      <form method="dialog">
        <h4 id="modal-title">
          Modal dialog
        <p>
          Pick an answer. Escape closes it without one.
        <label for="modal-name">
          Your name
        <input id="modal-name" name="name" type="text">
        <button class="button" id="modal-confirm" value="confirm">
          Confirm
        <button class="button secondary" id="modal-cancel" value="cancel">
          Cancel
    <dialog aria-labelledby="non-modal-title" id="non-modal-dialog">
      <h4 id="non-modal-title">
        Non-modal dialog
      <p>
        You can still use the page behind me.
      <button class="button secondary" id="non-modal-close" type="button">
        Close
  <script>
    var modal = document.getElementById('modal-dialog'); var nonModal = document.getElementById('non-modal-dialog'); var result = document.getElementById('result'); var closedWithEscape = false; document.getElementById('open-modal').addEventListener('click', function() { closedWithEscape = false; modal.returnValue = ''; modal.showModal(); result.textContent = 'Modal dialog is open'; }); modal.addEventListener('cancel', function() { closedWithEscape = true; }); modal.addEventListener('close', function() { if (closedWithEscape) { result.textContent = 'Modal dialog closed with Escape'; } else { var name = document.getElementById('modal-name').value; result.textContent = 'Modal dialog closed with: ' + modal.returnValue + (name ? ' (name: ' + name + ')' : ''); } }); document.getElementById('open-non-modal').addEventListener('click', function() { nonModal.show(); result.textContent = 'Non-modal dialog is open'; }); document.getElementById('non-modal-close').addEventListener('click', function() { nonModal.close(); result.textContent = 'Non-modal dialog closed'; });
