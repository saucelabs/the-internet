<div class="large-12 columns" id="content">
  <style>
    .shift { position: relative; left: -0px; }
  <div class="example">
    <h3>
      Shifting Content: Image
    <p>
      This example demonstrates an image shifting a few pixels in either direction on each page load.
    <p>
      To load it randomly, append
      <code>
        ?mode=random
      to the URL. Or
      <a href="/shifting_content/image?mode=random">
        click here
      .
    <p>
      To specify a differant numbor of pixels to shift the example, append
      <code>
        ?pixel_shift=100
      to the URL. Or
      <a href="/shifting_content/image?pixel_shift=100">
        click here
      .
    <p>
      To do both together, use
      <code>
        ?mode=random&pixel_shift=100
      . Or
      <a href="/shifting_content/image?mode=random&pixel_shift=100">
        click here
      .
    <p>
      For a simple image append
      <code>
        ?image_type=simple
      . Or
      <a href="/shifting_content/image?image_type=simple">
        click here
      .
    <hr>
    <img class="shift" src="/img/avatar.jpg">
