<div class="large-12 columns" id="content">
  <script>
    function jsAlert() { alert('I am a JS Alert'); log('You successfully clicked an alert'); } function jsConfirm() { var c = confirm('I am a JS Confirm'); var result = c === true ? 'Ok' : 'Cancel'; log('You clicked: ' + result); } function jsPrompt() { var p = prompt('I am a JS prompt'); log('You entered: ' + p); } function log(msg) { var result = document.getElementById('result'); result.innerHTML = msg; }
  <div class="example">
    <h3>
      JavaScript Alerts
    <p>
      Here are some examples of different JavaScript alerts which can be troublesome for automation
    <ul style="list-style-type: none;">
      <li>
        <button onclick="jsAlert()">
          Click for JS Alert
      <li>
        <button onclick="jsConfirm()">
          Click for JS Confirm
      <li>
        <button onclick="jsPrompt()">
          Click for JS Prompt
    <h4>
      Result:
    <p id="result" style="color:green">
