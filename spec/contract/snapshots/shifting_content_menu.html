<div class="large-12 columns" id="content">
  <style>
    a { color: #DA4B4B; text-decoration: none; } a:hover { color: #000; } ul { list-style-type: none; line-height: 50px; } li { display: inline; float: left; } li a { display: block; background: #ececec; padding: 0 20px; font-size: 18px; border: 1px solid #ccc; } li a:hover { background: #f2f2f2; font-size: 20px; } .shift { position: relative; left: -0px; }
  <div class="example">
    <h3>
      Shifting Content: Menu Element
    <p>
      This example demonstrates a menu element shifting a few pixels in either direction on each page load.
    <p>
      To load it randomly, append
      <code>
        ?mode=random
      to the URL. Or
      <a href="/shifting_content/menu?mode=random">
        click here
      .
    <p>
      To specify a differant numbor of pixels to shift the example, append
      <code>
        ?pixel_shift=100
      to the URL. Or
      <a href="/shifting_content/menu?pixel_shift=100">
        click here
      .
    <p>
      To do both together, use
      <code>
        ?mode=random&pixel_shift=100
      . Or
      <a href="/shifting_content/menu?mode=random&pixel_shift=100">
        click here
      .
    <hr>
    <ul>
      <li>
        <a href="/">

          About
      <li>
        <a href="/contact-us/">
          Contact Us
      <li>
        <a href="/portfolio/">
          Portfolio
      <li>
        <a class="shift" href="/gallery/">
          Gallery
      <ul>
