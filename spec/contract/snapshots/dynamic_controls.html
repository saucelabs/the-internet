<div class="large-12 columns" id="content">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.10.2/jquery.min.js">
  <script>
    function swapInput() { disableButton("#input-example button"); clearMessage(); showDelay("#input-example button"); pauseThenToggleControls("input"); } function swapCheckbox (){ disableButton("#checkbox-example button"); clearMessage(); showDelay("#checkbox-example button"); pauseThenToggleControls("checkbox"); }; function disableButton(locator) { $(locator).attr("disabled", true); }; function clearMessage() { if ($("#message").length) { $("#message").first().remove(); } }; function showDelay(locator) { $(locator).after("<div id='loading'>Wait for it... <img src='/img/ajax-loader.gif'></div></br>"); }; function pauseThenToggleControls(target) { setTimeout(function() { if (target === "checkbox") { toggleCheckboxControls(); } else if (target === "input") { toggleInputControls(); } }, 3000 ); }; function toggleCheckboxControls() { var btn = $("#checkbox-example button").first(); var check = $("#checkbox").first(); var load = $("#loading"); if ( btn.text() == "Remove") { check.remove(); btn.text("Add"); btn.after("<p id='message'>It's gone!</p>"); btn.attr("disabled", false); load.hide(); } else { btn.text("Remove"); btn.after("<div><input type='checkbox' id='checkbox'> A checkbox</div>"); btn.after("<p id='message'>It's back!</p>"); btn.attr("disabled", false); load.hide(); } }; function toggleInputControls() { var btn = $("#input-example button").first(); var input = $("#input-example input").first(); var load = $("#loading"); if ( btn.text() == "Enable") { input.prop("disabled", false) btn.after("<p id='message'>It's enabled!</p>"); btn.text("Disable"); btn.attr("disabled", false); load.hide(); } else { btn.text("Enable"); input.prop("disabled", true) btn.after("<p id='message'>It's disabled!</p>"); btn.attr("disabled", false); load.hide(); } };
  <div class="example">
    <h4>
      Dynamic Controls
    <p>
      This example demonstrates when elements (e.g., checkbox, input field, etc.) are changed asynchronously.
    <h4 class="subheader">
      Remove/add
    <form id="checkbox-example">
      <div id="checkbox">
        <input label="blah" type="checkbox">
        A checkbox
      <button autocomplete="off" onclick="swapCheckbox()" type="button">
        Remove
    <hr>
    <h4 class="subheader">
      Enable/disable
    <form id="input-example">
      <input disabled="disabled" style="width: 30%;" type="text">
      <button autocomplete="off" onclick="swapInput()" type="button">
        Enable
    <div>
