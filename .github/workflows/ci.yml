name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  contract:
    name: HTTP contract suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Every merged PR is a release, so each PR bumps VERSION and adds its changelog entry.
      - name: Check VERSION and changelog
        run: |
          version=$(cat VERSION)
          head -1 changelog.md | grep -qx "#$version" || { echo "::error::changelog.md must start with #$version"; exit 1; }
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && git ls-remote --exit-code --tags origin "refs/tags/$version" > /dev/null; then
            echo "::error::$version is already released; bump VERSION"; exit 1
          fi
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: bundle exec rake contract

  e2e:
    name: Browser suite on Sauce Labs (${{ matrix.browser }})
    needs: contract
    runs-on: ubuntu-latest
    # Secrets are not available to pull requests from forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox, edge, safari]
    env:
      TARGET: saucelabs
      BROWSER: ${{ matrix.browser }}
      # Sauce browsers bypass the tunnel for localhost, so use another name for the runner.
      BASE_URL: http://the-internet.test:9292
      SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
      SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
      SAUCE_REGION: us-west-1
      SAUCE_TUNNEL_NAME: the-internet-${{ github.run_id }}-${{ matrix.browser }}
      SAUCE_BUILD: "the-internet ${{ github.ref_name }} #${{ github.run_number }}"
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Start the app
        env:
          RACK_ENV: production # same mode as Heroku
        run: |
          echo "127.0.0.1 the-internet.test" | sudo tee -a /etc/hosts
          bundle exec puma -C config/puma.rb > puma.log 2>&1 &
          for i in $(seq 1 50); do curl -sf "$BASE_URL/" > /dev/null && exit 0; sleep 0.2; done
          cat puma.log; exit 1
      - uses: saucelabs/sauce-connect-action@v3
        with:
          username: ${{ secrets.SAUCE_USERNAME }}
          accessKey: ${{ secrets.SAUCE_ACCESS_KEY }}
          region: us
          tunnelName: ${{ env.SAUCE_TUNNEL_NAME }}
          proxyLocalhost: allow
      # 4 Sauce sessions per browser (16 in total); the tunnel is shared.
      - run: bundle exec parallel_rspec -n 4 spec/e2e
      - name: App log
        if: failure()
        run: cat puma.log

  docker:
    name: Docker image
    needs: contract
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.version }},enable={{is_default_branch}}
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Heroku
    needs: [contract, e2e, docker]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release tag
    concurrency:
      group: heroku-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Heroku rejects pushes from shallow clones
      # Heroku's git remote only builds what we push; GitHub is the source of truth.
      - run: git push --force "https://heroku:${HEROKU_API_KEY}@git.heroku.com/the-internet.git" HEAD:refs/heads/main
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
      - name: Smoke test
        run: |
          for i in $(seq 1 30); do
            curl -sf https://the-internet.herokuapp.com/ > /dev/null && exit 0
            sleep 5
          done
          exit 1
      - name: Tag the release
        run: |
          version=$(cat VERSION)
          if git ls-remote --exit-code --tags origin "refs/tags/$version" > /dev/null; then
            echo "$version is already tagged"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$version" -m "$version"
          git push origin "$version"
